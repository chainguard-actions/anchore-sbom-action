name: Test specific file scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to scan
        run: |
          # Create a simple archive file that syft can scan
          mkdir -p /tmp/test-scan-dir
          echo '{"name":"test-pkg","version":"1.0.0"}' > /tmp/test-scan-dir/package.json
          tar -czf /tmp/test-archive.tar.gz -C /tmp/test-scan-dir .

      - id: action
        uses: .
        with:
          file: "/tmp/test-archive.tar.gz"
          format: "spdx-json"
          output-file: "/tmp/sbom-file-scan.spdx.json"
          artifact-name: "sbom-test-file"
          upload-artifact: "false"
          upload-release-assets: "false"
          dependency-snapshot: "false"

      - name: Assert output file exists
        run: |
          echo "Checking SBOM output file from file scan..."
          if [ ! -f "/tmp/sbom-file-scan.spdx.json" ]; then
            echo "FAIL: SBOM output file not found at /tmp/sbom-file-scan.spdx.json"
            exit 1
          fi
          echo "PASS: SBOM output file exists"

      - name: Assert output file is valid JSON with SPDX fields
        run: |
          echo "Validating SBOM JSON from file scan..."
          if ! python3 -c "import json,sys; json.load(open('/tmp/sbom-file-scan.spdx.json'))" 2>&1; then
            echo "FAIL: SBOM output is not valid JSON"
            exit 1
          fi
          SPDX_VERSION=$(python3 -c "import json; d=json.load(open('/tmp/sbom-file-scan.spdx.json')); print(d.get('spdxVersion',''))" 2>/dev/null || echo "")
          echo "spdxVersion: $SPDX_VERSION"
          if [ -z "$SPDX_VERSION" ]; then
            echo "FAIL: spdxVersion field not found in SBOM"
            exit 1
          fi
          echo "PASS: SBOM from file scan contains spdxVersion: $SPDX_VERSION"
