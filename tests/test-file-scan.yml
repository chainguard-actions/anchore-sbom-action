name: Test scanning a specific file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to scan
        run: |
          # Create a simple package.json for syft to scan
          cat > /tmp/test-package.json << 'EOF'
          {
            "name": "test-app",
            "version": "1.0.0",
            "dependencies": {
              "lodash": "4.17.21"
            }
          }
          EOF
          echo "Created test package.json at /tmp/test-package.json"

      - id: action
        uses: .
        with:
          file: "/tmp/test-package.json"
          format: spdx-json
          upload-artifact: "false"
          upload-release-assets: "false"
          dependency-snapshot: "false"
          output-file: "/tmp/sbom-file-scan.spdx.json"

      - name: Assert SBOM output file exists for file scan
        run: |
          echo "Checking SBOM output file from file scan..."
          if [ ! -f "/tmp/sbom-file-scan.spdx.json" ]; then
            echo "FAIL: SBOM output file not found at /tmp/sbom-file-scan.spdx.json"
            exit 1
          fi
          echo "File exists. Checking it is valid JSON..."
          if ! python3 -c "import json,sys; json.load(open('/tmp/sbom-file-scan.spdx.json'))" 2>&1; then
            echo "FAIL: SBOM output is not valid JSON"
            exit 1
          fi
          echo "PASS: File scan SBOM is valid JSON"
