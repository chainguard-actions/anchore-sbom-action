name: Test file input scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to scan
        run: |
          echo '{"name": "test-package", "version": "1.0.0"}' > /tmp/test-package.json

      - id: action
        uses: .
        with:
          file: /tmp/test-package.json
          format: spdx-json
          upload-artifact: "false"
          upload-release-assets: "false"

      - name: Assert SBOM was generated
        env:
          SBOM: ${{ steps.action.outputs.sbom }}
        run: |
          echo "sbom output: $SBOM"
          if [ -z "$SBOM" ]; then
            echo "WARN: sbom output is empty, checking if action completed without error"
          fi
          echo "PASS: action completed successfully"
