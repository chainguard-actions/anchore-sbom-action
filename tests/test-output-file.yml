name: Test SBOM output to file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          format: spdx-json
          output-file: "/tmp/sbom-output.spdx.json"
          upload-artifact: "false"
          upload-release-assets: "false"
          dependency-snapshot: "false"
        continue-on-error: true

      - name: Assert output file was created
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -f "/tmp/sbom-output.spdx.json" ]; then
              echo "FAIL: output file /tmp/sbom-output.spdx.json was not created"
              exit 1
            fi
            echo "Output file contents (first 200 chars):"
            head -c 200 /tmp/sbom-output.spdx.json
            # Verify it looks like a valid SPDX JSON document
            if ! grep -q "spdxVersion\|SPDXID\|spdx" /tmp/sbom-output.spdx.json; then
              echo "FAIL: output file does not appear to be a valid SPDX document"
              exit 1
            fi
            echo "PASS: SBOM output file created and contains SPDX content"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or environment limitation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
