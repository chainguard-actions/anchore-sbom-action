name: Test image scan with registry credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          image: alpine:3.18
          registry-username: ""
          registry-password: ""
          format: spdx-json
          upload-artifact: "false"
          upload-release-assets: "false"

      - name: Assert SBOM was generated for image
        env:
          SBOM: ${{ steps.action.outputs.sbom }}
        run: |
          echo "sbom output: $SBOM"
          echo "PASS: image scan action completed successfully"
