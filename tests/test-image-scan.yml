name: Test container image scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pull small test image
        run: |
          docker pull alpine:3.18

      - id: action
        uses: .
        with:
          image: "alpine:3.18"
          format: "spdx-json"
          output-file: "/tmp/sbom-image-scan.spdx.json"
          artifact-name: "sbom-test-image"
          upload-artifact: "false"
          upload-release-assets: "false"
          dependency-snapshot: "false"

      - name: Assert output file exists
        run: |
          echo "Checking SBOM output file from image scan..."
          if [ ! -f "/tmp/sbom-image-scan.spdx.json" ]; then
            echo "FAIL: SBOM output file not found at /tmp/sbom-image-scan.spdx.json"
            exit 1
          fi
          echo "PASS: SBOM output file exists"

      - name: Assert SBOM is valid and contains packages
        run: |
          echo "Validating SBOM from image scan..."
          if ! python3 -c "import json,sys; json.load(open('/tmp/sbom-image-scan.spdx.json'))" 2>&1; then
            echo "FAIL: SBOM output is not valid JSON"
            exit 1
          fi
          SPDX_VERSION=$(python3 -c "import json; d=json.load(open('/tmp/sbom-image-scan.spdx.json')); print(d.get('spdxVersion',''))" 2>/dev/null || echo "")
          echo "spdxVersion: $SPDX_VERSION"
          if [ -z "$SPDX_VERSION" ]; then
            echo "FAIL: spdxVersion field not found in SBOM"
            exit 1
          fi
          # Alpine image should have packages
          PKG_COUNT=$(python3 -c "import json; d=json.load(open('/tmp/sbom-image-scan.spdx.json')); print(len(d.get('packages',[])))" 2>/dev/null || echo "0")
          echo "Package count: $PKG_COUNT"
          if [ "$PKG_COUNT" -lt 1 ]; then
            echo "FAIL: expected at least 1 package in alpine image SBOM, got $PKG_COUNT"
            exit 1
          fi
          echo "PASS: SBOM from image scan contains $PKG_COUNT packages"
