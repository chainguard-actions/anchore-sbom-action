name: Test container image scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          image: "alpine:3.18"
          format: "spdx-json"
          output-file: "/tmp/image-sbom.json"
          upload-artifact: "false"
          upload-release-assets: "false"
          github-token: ${{ github.token }}

      - name: Assert SBOM was generated from image scan
        run: |
          echo "Checking for SBOM output at /tmp/image-sbom.json"
          if [ ! -f "/tmp/image-sbom.json" ]; then
            echo "FAIL: SBOM output file not found"
            exit 1
          fi
          SIZE=$(wc -c < /tmp/image-sbom.json)
          echo "SBOM file size: $SIZE bytes"
          if [ "$SIZE" -lt 10 ]; then
            echo "FAIL: SBOM file appears empty"
            exit 1
          fi
          echo "PASS: SBOM file generated from image scan"

      - name: Assert SBOM is valid SPDX JSON with packages
        run: |
          if ! python3 -c "import json, sys; json.load(open('/tmp/image-sbom.json'))" 2>/dev/null; then
            echo "FAIL: SBOM output is not valid JSON"
            exit 1
          fi
          PKG_COUNT=$(python3 -c "import json; d=json.load(open('/tmp/image-sbom.json')); print(len(d.get('packages', [])))" 2>/dev/null || echo "0")
          echo "Package count: $PKG_COUNT"
          if [ "$PKG_COUNT" -eq 0 ]; then
            echo "FAIL: no packages found in SBOM for alpine:3.18"
            exit 1
          fi
          echo "PASS: SBOM contains $PKG_COUNT packages"
