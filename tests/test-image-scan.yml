name: Test image scan with registry credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          image: "alpine:3.18"
          registry-username: "testuser"
          registry-password: "testpassword"
          format: "spdx-json"
          upload-artifact: "false"
          upload-release-assets: "false"

      - name: Assert image scan ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SBOM: ${{ steps.action.outputs.sbom }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sbom output: $SBOM"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SBOM" ]; then
              echo "FAIL: action succeeded but sbom output is empty"
              exit 1
            fi
            echo "PASS: image scan succeeded with sbom output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
