name: Test image scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          image: alpine:latest
          registry-username: ""
          registry-password: ""
          format: spdx-json
          upload-artifact: "false"
          upload-release-assets: "false"
          output-file: /tmp/sbom-image.json

      - name: Assert SBOM output file exists and is non-empty
        run: |
          echo "Checking SBOM output file..."
          if [ ! -f /tmp/sbom-image.json ]; then
            echo "FAIL: SBOM output file not found at /tmp/sbom-image.json"
            exit 1
          fi
          SIZE=$(wc -c < /tmp/sbom-image.json)
          echo "SBOM file size: $SIZE bytes"
          if [ "$SIZE" -lt 10 ]; then
            echo "FAIL: SBOM output file is too small (likely empty)"
            exit 1
          fi
          echo "PASS: SBOM image scan output file exists and is non-empty"
