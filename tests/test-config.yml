name: Test config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: "."
          config: "${{ github.workspace }}/hardened/tests/fixtures/syft-config/.syft.yaml"
          format: "spdx-json"
          upload-artifact: "false"
          upload-release-assets: "false"
          dependency-snapshot: "false"
      - name: Assert action completed successfully
        run: |
          echo "Action completed successfully with custom config input"
          echo "PASS"
