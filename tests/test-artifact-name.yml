name: Test custom artifact name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: sbom
        uses: .
        with:
          path: "."
          format: "spdx-json"
          artifact-name: "my-custom-sbom.spdx.json"
          output-file: "/tmp/sbom-artifact-test.json"
          upload-artifact: "false"
          upload-release-assets: "false"
          dependency-snapshot: "false"

      - name: Assert output file exists
        run: |
          echo "Checking for output file at /tmp/sbom-artifact-test.json"
          if [ ! -f "/tmp/sbom-artifact-test.json" ]; then
            echo "FAIL: output file not found"
            exit 1
          fi
          echo "PASS: output file exists"

      - name: Assert output file is valid JSON with SPDX content
        run: |
          if ! python3 -c "import json; json.load(open('/tmp/sbom-artifact-test.json'))" 2>&1; then
            echo "FAIL: output file is not valid JSON"
            exit 1
          fi
          if ! grep -q "SPDXID" /tmp/sbom-artifact-test.json; then
            echo "FAIL: output does not contain SPDX structure"
            exit 1
          fi
          echo "PASS: output file is valid SPDX JSON"
