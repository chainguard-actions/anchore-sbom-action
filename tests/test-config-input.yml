name: Test config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create syft config file
        run: |
          cat > /tmp/syft-config.yaml << 'EOF'
          output:
            - spdx-json
          EOF

      - id: action
        uses: .
        with:
          path: "."
          format: spdx-json
          config: /tmp/syft-config.yaml
          upload-artifact: "false"
          upload-release-assets: "false"

      - name: Assert action completed with config
        env:
          SBOM: ${{ steps.action.outputs.sbom }}
        run: |
          echo "sbom output: $SBOM"
          echo "PASS: action completed with config file"
