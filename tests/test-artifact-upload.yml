name: Test artifact upload with custom name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: "."
          format: spdx-json
          artifact-name: "test-sbom-artifact"
          upload-artifact: "true"
          upload-release-assets: "false"
          dependency-snapshot: "false"
          output-file: "/tmp/sbom-artifact-test.spdx.json"

      - name: Assert action ran and produced SBOM or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded. Checking SBOM output file..."
            if [ ! -f "/tmp/sbom-artifact-test.spdx.json" ]; then
              echo "FAIL: action succeeded but SBOM output file not found"
              exit 1
            fi
            if ! python3 -c "import json,sys; json.load(open('/tmp/sbom-artifact-test.spdx.json'))" 2>&1; then
              echo "FAIL: SBOM output is not valid JSON"
              exit 1
            fi
            echo "PASS: action succeeded and produced valid SBOM"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo for artifact upload)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
