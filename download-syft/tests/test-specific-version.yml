name: Test Syft download with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          run: download-syft
          syft-version: "1.19.0"
        continue-on-error: true

      - name: Assert cmd output or graceful failure
        env:
          CMD: ${{ steps.action.outputs.cmd }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cmd: $CMD"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CMD" ]; then
              echo "FAIL: action succeeded but cmd output is empty"
              exit 1
            fi
            echo "PASS: cmd output is set to '$CMD'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely network/API issue in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert Syft binary is executable (if action succeeded)
        env:
          CMD: ${{ steps.action.outputs.cmd }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping binary check"
            exit 0
          fi
          echo "Testing Syft binary at: $CMD"
          if [ ! -x "$CMD" ]; then
            echo "FAIL: Syft binary is not executable at '$CMD'"
            exit 1
          fi
          echo "PASS: Syft binary is executable"

      - name: Assert Syft version matches requested version (if action succeeded)
        env:
          CMD: ${{ steps.action.outputs.cmd }}
          OUTCOME: ${{ steps.action.outcome }}
          EXPECTED_VERSION: "1.19.0"
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping version check"
            exit 0
          fi
          echo "Running: $CMD version"
          VERSION_OUTPUT="$("$CMD" version 2>&1)"
          echo "Version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "$EXPECTED_VERSION"; then
            echo "PASS: Syft version matches expected '$EXPECTED_VERSION'"
          else
            echo "FAIL: Syft version output does not contain '$EXPECTED_VERSION'"
            echo "Full output: $VERSION_OUTPUT"
            exit 1
          fi
