name: Test basic Syft download (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          run: download-syft

      - name: Assert cmd output is set
        env:
          CMD: ${{ steps.action.outputs.cmd }}
        run: |
          echo "cmd: $CMD"
          if [ -z "$CMD" ]; then
            echo "FAIL: expected cmd output to be non-empty"
            exit 1
          fi
          echo "PASS: cmd output is set to '$CMD'"

      - name: Assert Syft binary is executable
        env:
          CMD: ${{ steps.action.outputs.cmd }}
        run: |
          echo "Testing Syft binary at: $CMD"
          if [ ! -x "$CMD" ]; then
            echo "FAIL: Syft binary is not executable at '$CMD'"
            exit 1
          fi
          echo "PASS: Syft binary is executable"

      - name: Assert Syft runs and reports version
        env:
          CMD: ${{ steps.action.outputs.cmd }}
        run: |
          echo "Running: $CMD version"
          "$CMD" version
          if [ $? -ne 0 ]; then
            echo "FAIL: Syft binary failed to run"
            exit 1
          fi
          echo "PASS: Syft ran successfully"
